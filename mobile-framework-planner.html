<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartWorkz Mobile Framework Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 320px 1fr 400px;
            height: 100vh;
            gap: 1px;
            background: #1a1a1a;
        }

        .panel {
            background: #0f0f0f;
            border-right: 1px solid #2a2a2a;
            overflow-y: auto;
            padding: 20px;
        }

        .panel.preview {
            border-right: none;
            border-left: 1px solid #2a2a2a;
            border-right: 1px solid #2a2a2a;
        }

        .panel.output {
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-label {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: #1a1a1a;
        }

        input[type="checkbox"],
        input[type="radio"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #007AFF;
        }

        .checkbox-label {
            font-size: 13px;
            cursor: pointer;
            flex: 1;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .radio-item:hover {
            background: #1a1a1a;
        }

        .divider {
            height: 1px;
            background: #2a2a2a;
            margin: 16px 0;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .preset-btn {
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            background: #2a2a2a;
            border-color: #007AFF;
        }

        .preview-section {
            margin-bottom: 32px;
        }

        .preview-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
            border-bottom: 2px solid #2a2a2a;
            padding-bottom: 8px;
        }

        .architecture-layers {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .layer {
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #007AFF;
            background: #1a1a1a;
            font-size: 12px;
            font-weight: 500;
        }

        .layer.ui { border-left-color: #FF9500; }
        .layer.state { border-left-color: #34C759; }
        .layer.data { border-left-color: #007AFF; }
        .layer.platform { border-left-color: #FF3B30; }
        .layer.network { border-left-color: #5856D6; }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .phase {
            position: relative;
            padding-left: 24px;
            padding-top: 8px;
            padding-bottom: 8px;
            font-size: 12px;
            border-left: 2px solid #2a2a2a;
            transition: all 0.2s;
        }

        .phase.active {
            border-left-color: #007AFF;
        }

        .phase::before {
            content: '';
            position: absolute;
            left: -7px;
            top: 12px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 2px solid #0f0f0f;
        }

        .phase.active::before {
            background: #007AFF;
        }

        .phase-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .phase-duration {
            font-size: 11px;
            color: #666;
        }

        .component-tree {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
        }

        .tree-item {
            padding: 6px 8px;
            background: #1a1a1a;
            border-radius: 3px;
            margin-left: 12px;
            border-left: 2px solid #2a2a2a;
            transition: all 0.2s;
            cursor: pointer;
        }

        .tree-item:hover {
            background: #2a2a2a;
            border-left-color: #007AFF;
        }

        .tree-item.phase3a { border-left-color: #34C759; }
        .tree-item.phase3b { border-left-color: #FF9500; }
        .tree-item.phase3c { border-left-color: #5856D6; }

        .decision-tree {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 12px;
        }

        .decision {
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            border: 1px solid #2a2a2a;
        }

        .decision-question {
            font-weight: 600;
            color: #007AFF;
            margin-bottom: 6px;
        }

        .decision-option {
            padding: 4px 6px;
            color: #999;
            font-size: 11px;
        }

        .dependency-viz {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 12px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            overflow-x: auto;
        }

        .dep-line { color: #666; }
        .dep-module { color: #007AFF; font-weight: 600; }
        .dep-arrow { color: #999; }
        .dep-target { color: #34C759; }

        .output-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
        }

        .copy-btn {
            padding: 10px 16px;
            background: #007AFF;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #0051D5;
        }

        .copy-feedback {
            font-size: 11px;
            color: #34C759;
            margin-top: 8px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 11px;
        }

        .stat {
            background: #1a1a1a;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid #007AFF;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .stat-label {
            color: #666;
            font-size: 10px;
            margin-top: 2px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Controls Panel -->
        <div class="panel">
            <h1>Framework Plan</h1>

            <div class="control-group">
                <span class="control-label">Quick Presets</span>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="applyPreset('mvp')">MVP</button>
                    <button class="preset-btn" onclick="applyPreset('full')">Full</button>
                    <button class="preset-btn" onclick="applyPreset('enterprise')">Enterprise</button>
                </div>
            </div>

            <div class="divider"></div>

            <div class="control-group">
                <span class="control-label">Architecture Layers</span>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="showUI" onchange="updateAll()" checked>
                        <span class="checkbox-label">UI Components</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="showState" onchange="updateAll()" checked>
                        <span class="checkbox-label">State Management</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="showData" onchange="updateAll()" checked>
                        <span class="checkbox-label">Data Layer</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="showPlatform" onchange="updateAll()" checked>
                        <span class="checkbox-label">Platform Services</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="showNetwork" onchange="updateAll()" checked>
                        <span class="checkbox-label">Network Layer</span>
                    </label>
                </div>
            </div>

            <div class="control-group">
                <span class="control-label">Phase Focus</span>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="phase" value="all" onchange="updateAll()" checked>
                        <span class="checkbox-label">All Phases</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="phase" value="3a" onchange="updateAll()">
                        <span class="checkbox-label">Phase 3A (Infrastructure)</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="phase" value="3b" onchange="updateAll()">
                        <span class="checkbox-label">Phase 3B (UI)</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="phase" value="3c" onchange="updateAll()">
                        <span class="checkbox-label">Phase 3C (DX)</span>
                    </label>
                </div>
            </div>

            <div class="control-group">
                <span class="control-label">Technology Choices</span>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="useRedux" onchange="updateAll()" checked>
                        <span class="checkbox-label">Redux State Container</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="useSQLite" onchange="updateAll()" checked>
                        <span class="checkbox-label">SQLite + ORM</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="useSentry" onchange="updateAll()" checked>
                        <span class="checkbox-label">Sentry Crash Reports</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="useLocalization" onchange="updateAll()" checked>
                        <span class="checkbox-label">Localization (i18n)</span>
                    </label>
                </div>
            </div>

            <div class="control-group">
                <span class="control-label">Include Details</span>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="showTimeline" onchange="updateAll()" checked>
                        <span class="checkbox-label">Timeline</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="showComponents" onchange="updateAll()" checked>
                        <span class="checkbox-label">Components</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="showDependencies" onchange="updateAll()" checked>
                        <span class="checkbox-label">Dependencies</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="panel preview">
            <h1>Architecture & Roadmap</h1>

            <div id="statsContainer" class="stats"></div>

            <div id="architecturePreview" class="preview-section">
                <div class="preview-title">Framework Layers</div>
                <div class="architecture-layers" id="architectureLayers"></div>
            </div>

            <div id="timelineContainer" class="preview-section" style="display:none;">
                <div class="preview-title">Implementation Timeline</div>
                <div class="timeline" id="timelinePreview"></div>
            </div>

            <div id="componentContainer" class="preview-section" style="display:none;">
                <div class="preview-title">Component Roadmap</div>
                <div class="component-tree" id="componentTree"></div>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="panel output">
            <h1>Implementation Plan</h1>
            <div class="output-content" id="output">Adjust settings to generate plan...</div>
            <button class="copy-btn" onclick="copyToClipboard()">Copy Plan</button>
            <div class="copy-feedback" id="feedback">Copied to clipboard!</div>
        </div>
    </div>

    <script>
        const state = {
            showUI: true,
            showState: true,
            showData: true,
            showPlatform: true,
            showNetwork: true,
            phase: 'all',
            useRedux: true,
            useSQLite: true,
            useSentry: true,
            useLocalization: true,
            showTimeline: true,
            showComponents: true,
            showDependencies: true
        };

        function updateAll() {
            // Read all checkboxes
            state.showUI = document.getElementById('showUI').checked;
            state.showState = document.getElementById('showState').checked;
            state.showData = document.getElementById('showData').checked;
            state.showPlatform = document.getElementById('showPlatform').checked;
            state.showNetwork = document.getElementById('showNetwork').checked;
            state.phase = document.querySelector('input[name="phase"]:checked').value;
            state.useRedux = document.getElementById('useRedux').checked;
            state.useSQLite = document.getElementById('useSQLite').checked;
            state.useSentry = document.getElementById('useSentry').checked;
            state.useLocalization = document.getElementById('useLocalization').checked;
            state.showTimeline = document.getElementById('showTimeline').checked;
            state.showComponents = document.getElementById('showComponents').checked;
            state.showDependencies = document.getElementById('showDependencies').checked;

            renderPreview();
            updatePrompt();
        }

        function renderPreview() {
            renderArchitecture();
            renderTimeline();
            renderComponents();
            renderStats();
        }

        function renderArchitecture() {
            const layers = [];
            if (state.showUI) layers.push('<div class="layer ui">🎨 UI Components (15+ components)</div>');
            if (state.showState) layers.push('<div class="layer state">⚙️ State Management (Redux Container)</div>');
            if (state.showData) layers.push('<div class="layer data">💾 Data Layer (SQLite ORM)</div>');
            if (state.showPlatform) layers.push('<div class="layer platform">📱 Platform Services (44+ services)</div>');
            if (state.showNetwork) layers.push('<div class="layer network">🌐 Network Layer (HTTP + SignalR)</div>');

            document.getElementById('architectureLayers').innerHTML = layers.join('');
        }

        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            if (!state.showTimeline) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';

            let phases = [];
            if (state.phase === 'all' || state.phase === '3a') {
                phases.push({
                    title: 'Phase 3A: Infrastructure',
                    duration: '2-3 weeks',
                    active: state.phase === '3a'
                });
            }
            if (state.phase === 'all' || state.phase === '3b') {
                phases.push({
                    title: 'Phase 3B: UI Components',
                    duration: '2-3 weeks',
                    active: state.phase === '3b'
                });
            }
            if (state.phase === 'all' || state.phase === '3c') {
                phases.push({
                    title: 'Phase 3C: Developer Experience',
                    duration: '1-2 weeks',
                    active: state.phase === '3c'
                });
            }

            const html = phases.map(p =>
                `<div class="phase ${p.active ? 'active' : ''}">
                    <div class="phase-title">${p.title}</div>
                    <div class="phase-duration">${p.duration}</div>
                </div>`
            ).join('');

            document.getElementById('timelinePreview').innerHTML = html;
        }

        function renderComponents() {
            const container = document.getElementById('componentContainer');
            if (!state.showComponents) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';

            const components = {
                'Phase 3A': [
                    '✓ State Management Container (Redux)',
                    '✓ Local Database Abstraction',
                    '✓ Crash Reporting Service',
                    '✓ Push Notification Handler'
                ],
                'Phase 3B': [
                    '+ Date/Time Picker',
                    '+ Search Bar',
                    '+ Data Grid/Table',
                    '+ Tabs/Segmented Control',
                    '+ Bottom Sheet'
                ],
                'Phase 3C': [
                    '+ Localization Framework',
                    '+ Environment Configuration',
                    '+ Accessibility Helpers',
                    '+ Testing Framework'
                ]
            };

            let html = '';
            Object.entries(components).forEach(([phase, items]) => {
                const phaseClass = phase === 'Phase 3A' ? 'phase3a' : phase === 'Phase 3B' ? 'phase3b' : 'phase3c';
                html += items.map(item => `<div class="tree-item ${phaseClass}">${item}</div>`).join('');
            });

            document.getElementById('componentTree').innerHTML = html;
        }

        function renderStats() {
            const totalComponents = 6 + (state.showComponents ? 9 : 0);
            const totalServices = 44 + (state.useSentry ? 1 : 0) + (state.useLocalization ? 1 : 0);
            const totalWeeks = state.phase === '3a' || state.phase === '3b' ? '2-3' : state.phase === '3c' ? '1-2' : '5-8';

            const html = `
                <div class="stat">
                    <div class="stat-value">${totalComponents}</div>
                    <div class="stat-label">UI Components</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${totalServices}</div>
                    <div class="stat-label">Services</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${totalWeeks}w</div>
                    <div class="stat-label">Timeline</div>
                </div>
                <div class="stat">
                    <div class="stat-value">5+</div>
                    <div class="stat-label">Team Size</div>
                </div>
            `;
            document.getElementById('statsContainer').innerHTML = html;
        }

        function updatePrompt() {
            let prompt = '# SmartWorkz Mobile Framework - Phase 3 Implementation Plan\n\n';
            prompt += `**Configuration:**\n`;

            const parts = [];
            if (state.useRedux) parts.push('Redux-based state management');
            if (state.useSQLite) parts.push('SQLite with ORM abstraction');
            if (state.useSentry) parts.push('Sentry crash reporting');
            if (state.useLocalization) parts.push('i18n localization framework');

            prompt += parts.map(p => `• ${p}`).join('\n') + '\n\n';

            if (state.phase === 'all' || state.phase === '3a') {
                prompt += `## Phase 3A: Infrastructure (2-3 weeks)\n`;
                prompt += `1. **State Management** - Implement Redux container with actions/reducers\n`;
                prompt += `2. **Local Database** - Add SQLite ORM abstraction layer\n`;
                prompt += `3. **Crash Reporting** - Integrate Sentry SDK\n`;
                prompt += `4. **Push Notifications** - Complete message handling pipeline\n\n`;
            }

            if (state.phase === 'all' || state.phase === '3b') {
                prompt += `## Phase 3B: UI Components (2-3 weeks)\n`;
                prompt += `1. **Date/Time Picker** - Cross-platform picker with validation\n`;
                prompt += `2. **Search Bar** - Type-ahead search with filtering\n`;
                prompt += `3. **Data Grid** - Table component with sorting/pagination\n`;
                prompt += `4. **Tabs** - Segmented control navigation\n`;
                prompt += `5. **Bottom Sheet** - Modal drawer component\n`;
                prompt += `6. **Bonus**: Image Gallery, Maps, Charts, Forms, etc.\n\n`;
            }

            if (state.phase === 'all' || state.phase === '3c') {
                prompt += `## Phase 3C: Developer Experience (1-2 weeks)\n`;
                if (state.useLocalization) {
                    prompt += `1. **Localization** - Multi-language support with culture switching\n`;
                }
                prompt += `2. **Configuration** - Environment-based settings (dev/staging/prod)\n`;
                prompt += `3. **Accessibility** - WCAG compliance helpers and guidelines\n`;
                prompt += `4. **Testing** - Component and integration test framework\n\n`;
            }

            prompt += `## Architecture Overview\n`;
            prompt += `**Layers:**\n`;
            if (state.showUI) prompt += `• UI Components: 15+ production-ready MAUI controls\n`;
            if (state.showState) prompt += `• State Management: Centralized Redux store with DevTools\n`;
            if (state.showData) prompt += `• Data Layer: SQLite ORM with migrations and querying\n`;
            if (state.showPlatform) prompt += `• Platform Services: 45+ device feature integrations (iOS/Android/macOS/Windows)\n`;
            if (state.showNetwork) prompt += `• Network Layer: HTTP interceptors, SignalR real-time, offline sync\n`;

            prompt += `\n## Success Criteria\n`;
            prompt += `✓ Framework supports any app type (e-commerce, enterprise, social, etc.)\n`;
            prompt += `✓ Comprehensive UI component library (15+ components)\n`;
            prompt += `✓ Production-grade infrastructure (state, DB, crash reporting, auth)\n`;
            prompt += `✓ Full platform coverage (iOS, Android, macOS, Windows)\n`;
            prompt += `✓ 95%+ test coverage for critical paths\n`;
            prompt += `✓ Complete documentation with examples\n`;

            document.getElementById('output').textContent = prompt;
        }

        function applyPreset(preset) {
            if (preset === 'mvp') {
                document.getElementById('showUI').checked = true;
                document.getElementById('showState').checked = true;
                document.getElementById('showData').checked = true;
                document.getElementById('showPlatform').checked = true;
                document.getElementById('showNetwork').checked = false;
                document.getElementById('useRedux').checked = true;
                document.getElementById('useSQLite').checked = true;
                document.getElementById('useSentry').checked = false;
                document.getElementById('useLocalization').checked = false;
            } else if (preset === 'full') {
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
            } else if (preset === 'enterprise') {
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
                document.querySelector('input[name="phase"]:checked').checked = false;
                document.querySelector('input[name="phase"][value="all"]').checked = true;
            }
            updateAll();
        }

        function copyToClipboard() {
            const text = document.getElementById('output').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const feedback = document.getElementById('feedback');
                feedback.classList.add('show');
                setTimeout(() => feedback.classList.remove('show'), 2000);
            });
        }

        // Initial render
        updateAll();
    </script>
</body>
</html>
