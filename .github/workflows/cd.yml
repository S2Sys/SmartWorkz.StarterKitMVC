name: CD - Deploy to Staging

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://smartworkz-staging.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.public
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/public:staging
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/public:staging
          cache-to: type=inline

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Example: kubectl apply -f k8s/staging/deployment.yaml
          # This is a placeholder for actual deployment logic
          echo "✓ Deployment complete"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          ENVIRONMENT: staging

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          # Placeholder for notification (Slack, email, etc.)
