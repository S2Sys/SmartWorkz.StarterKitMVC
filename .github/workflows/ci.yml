name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic || true

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal --logger "console;verbosity=detailed"

      - name: Publish
        run: |
          dotnet publish src/SmartWorkz.StarterKitMVC.Public/SmartWorkz.StarterKitMVC.Public.csproj -c Release -o ./publish/public
          dotnet publish src/SmartWorkz.StarterKitMVC.Admin/SmartWorkz.StarterKitMVC.Admin.csproj -c Release -o ./publish/admin || true

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Public image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.public
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/public:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/public:latest
          cache-to: type=inline
